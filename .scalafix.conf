# Syntactic rules only: they need no SemanticDB, so `fix` stays fast enough to run on
# every pull request.
#
# SCALA_CODE_STYLE.md lists a wider set (noVars, noThrows, noDefaultArgs,
# ExplicitResultTypes). Those are deliberately NOT enabled: this codebase uses local
# `var` in render loops for speed, `throw` for programmer errors in static declarations
# such as `binding`, and default arguments throughout the widget constructors. A rule
# the code does not follow is a rule nobody reads.
rules = [
  DisableSyntax,
  NoValInForComprehension,
]

DisableSyntax.noNulls = true
DisableSyntax.noReturns = true
DisableSyntax.noIsInstanceOf = true
DisableSyntax.noAsInstanceOf = true
DisableSyntax.noFinalize = true
